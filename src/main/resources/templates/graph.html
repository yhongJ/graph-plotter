<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Graph Plotter</title>
    <link rel = "stylesheet" type = "text/css" href = "/css/graph.css">
</head>
<body>
    <h1>2D coordinate plane </h1> <br> <br>
    <div class = "graph">
        <canvas id = "plane">
        </canvas>
        <script src = "/js/coordinate.js"></script>
    </div> <br>
    <p>
        This site supports graphs of polynomial functions and basic transcendental functions
        (sin, cos, tan, log, ^).
    </p> <br> <br>

    <p>
        Examples: y = a*x^3 + b*x^2 + c, y = sin(x), y = cos(x), y = tan(x), y = log(x), y = a^x
        <br> <br>
        ! log(x) represents the logarithm of x with base natural number e !
    </p> <br> <br>

    <form method="post" action="/addGraph">
        <input id="graph" type="text" name="graph">
        <button id="drawButton" type="submit">Add Graph</button>
    </form>
    <script type = "module" src = "/js/plotter.js"></script>
    <ul>
        <li th:each="graph : ${graphs}">
            <span th:text="${graph.graph}"></span>
            <form th:action="@{/graphs/{id}(id=${graph.id})}" method="post">
                <button type="submit">Delete</button>
            </form>
        </li>
    </ul>
    <p id="errorMessage"></p>

</body>
</html>
